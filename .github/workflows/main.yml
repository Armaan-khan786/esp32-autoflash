name: ESP32 Auto Flash

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  flash:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner info (debug)
        run: |
          echo Running on %COMPUTERNAME%
          echo Current directory:
          cd

      - name: Flash ESP32
        run: |
          echo Starting ESP32 Flash
          esp32_flash.bat
